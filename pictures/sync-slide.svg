<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 68">
  <!-- Song Sync: a two-position slide switch on the same brushed plate, with a red jewel lamp that lights when it is on. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeece4"/>
      <stop offset="0.5" stop-color="#d8d5cb"/>
      <stop offset="1" stop-color="#bebbb0"/>
    </linearGradient>
    <pattern id="brush" x="0" y="0" width="40" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="1" fill="#ffffff" opacity="0.13"/>
      <rect x="0" y="2" width="40" height="1" fill="#55524a" opacity="0.06"/>
    </pattern>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040506"/>
      <stop offset="1" stop-color="#1d2226"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55575d"/>
      <stop offset="0.18" stop-color="#2d2f34"/>
      <stop offset="1" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf8"/>
      <stop offset="0.48" stop-color="#a9a69c"/>
      <stop offset="0.54" stop-color="#e6e3d9"/>
      <stop offset="1" stop-color="#7b786f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#ff3b4e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffb3ba"/>
      <stop offset="0.45" stop-color="#ff3b4e"/>
      <stop offset="1" stop-color="#c41f31"/>
    </radialGradient>
  </defs>

  <!-- the plate -->
  <rect x="5" y="6.5" width="96" height="60" rx="7" fill="#3a3528" opacity="0.3"/>
  <rect x="4" y="4" width="96" height="60" rx="7" fill="url(#plate)"/>
  <rect x="4" y="4" width="96" height="60" rx="7" fill="url(#brush)"/>
  <rect x="4" y="4" width="96" height="60" rx="7" fill="none" stroke="#7e7a6e" stroke-width="1.5"/>
  <rect x="10" y="5.2" width="84" height="1.4" rx="0.7" fill="#ffffff" opacity="0.85"/>
  <rect x="10" y="61.4" width="84" height="1.4" rx="0.7" fill="#6f6b60" opacity="0.45"/>

  <!-- printed marks: a ring for off, a bar for on -->
  <circle cx="24" cy="13.5" r="3.4" fill="none" stroke="#24262b" stroke-width="1.7" opacity="0.85"/>
  <rect x="45.8" y="9.4" width="2.4" height="8.4" rx="1.2" fill="#24262b" opacity="0.85"/>

  <!-- the slot -->
  <rect x="11" y="43.2" width="50" height="1.6" rx="0.8" fill="#ffffff" opacity="0.7"/>
  <rect x="11" y="31.5" width="50" height="11" rx="5.5" fill="url(#slot)"/>
  <rect x="11" y="31.5" width="50" height="11" rx="5.5" fill="none" stroke="#050607" stroke-width="1.2"/>

  <!-- the lamp: dark when off, lit when on -->
  <circle cx="81" cy="37" r="{15 * t}" fill="url(#halo)"/>
  <circle cx="81" cy="37" r="10.5" fill="url(#chrome)"/>
  <circle cx="81" cy="37" r="10.5" fill="none" stroke="#5f5b50" stroke-width="0.8"/>
  <circle cx="81" cy="37" r="7.6" fill="#3a1418"/>
  <circle cx="81" cy="37" r="7.6" fill="url(#lens)" opacity="{t}"/>
  <circle cx="81" cy="37" r="7.6" fill="none" stroke="#1c0a0c" stroke-width="1"/>
  <circle cx="78.4" cy="34.2" r="2" fill="#ffffff" opacity="{0.3 + 0.4 * t}"/>

  <!-- the cap: left is off, right is on -->
  <g transform="translate({24 + 23 * t} 37)">
    <rect x="-9" y="-13" width="24" height="33" rx="4" fill="#000000" opacity="0.32"/>
    <rect x="-13" y="-7.5" width="26" height="15" rx="3" fill="url(#chrome)"/>
    <rect x="-13" y="-7.5" width="26" height="15" rx="3" fill="none" stroke="#5f5b50" stroke-width="0.8"/>
    <rect x="-11" y="-15.5" width="22" height="31" rx="3.5" fill="url(#cap)"/>
    <rect x="-11" y="-15.5" width="22" height="31" rx="3.5" fill="none" stroke="#08090a" stroke-width="1"/>
    <rect x="-8.5" y="-14.1" width="17" height="1.5" rx="0.75" fill="#ffffff" opacity="0.38"/>
    <g stroke="#060708" stroke-width="1.4" stroke-linecap="round">
      <line x1="-7.4" y1="-10" x2="-7.4" y2="10"/>
      <line x1="-4.4" y1="-10" x2="-4.4" y2="10"/>
      <line x1="4.4" y1="-10" x2="4.4" y2="10"/>
      <line x1="7.4" y1="-10" x2="7.4" y2="10"/>
    </g>
    <g stroke="#74767c" stroke-width="0.7" stroke-linecap="round" opacity="0.75">
      <line x1="-6.3" y1="-10" x2="-6.3" y2="10"/>
      <line x1="-3.3" y1="-10" x2="-3.3" y2="10"/>
      <line x1="5.5" y1="-10" x2="5.5" y2="10"/>
      <line x1="8.5" y1="-10" x2="8.5" y2="10"/>
    </g>
    <rect x="-1.5" y="-12.5" width="3" height="25" rx="1.5" fill="#f6f3ea"/>
  </g>
</svg>
