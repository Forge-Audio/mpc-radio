<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 68">
  <!-- Mix: a boombox slider. Brushed plate, printed 0 to 10 scale, black slot, ribbed cap that follows the control. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeece4"/>
      <stop offset="0.5" stop-color="#d8d5cb"/>
      <stop offset="1" stop-color="#bebbb0"/>
    </linearGradient>
    <pattern id="brush" x="0" y="0" width="40" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="1" fill="#ffffff" opacity="0.13"/>
      <rect x="0" y="2" width="40" height="1" fill="#55524a" opacity="0.06"/>
    </pattern>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040506"/>
      <stop offset="1" stop-color="#1d2226"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55575d"/>
      <stop offset="0.18" stop-color="#2d2f34"/>
      <stop offset="1" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf8"/>
      <stop offset="0.48" stop-color="#a9a69c"/>
      <stop offset="0.54" stop-color="#e6e3d9"/>
      <stop offset="1" stop-color="#7b786f"/>
    </linearGradient>
  </defs>

  <!-- the plate, lit from the top left -->
  <rect x="5" y="6.5" width="258" height="60" rx="7" fill="#3a3528" opacity="0.3"/>
  <rect x="4" y="4" width="258" height="60" rx="7" fill="url(#plate)"/>
  <rect x="4" y="4" width="258" height="60" rx="7" fill="url(#brush)"/>
  <rect x="4" y="4" width="258" height="60" rx="7" fill="none" stroke="#7e7a6e" stroke-width="1.5"/>
  <rect x="10" y="5.2" width="246" height="1.4" rx="0.7" fill="#ffffff" opacity="0.85"/>
  <rect x="10" y="61.4" width="246" height="1.4" rx="0.7" fill="#6f6b60" opacity="0.45"/>

  <!-- printed scale: 0 to 10 -->
  <g stroke="#24262b" stroke-linecap="round" opacity="0.85">
    <g stroke-width="2.4">
      <line x1="26" y1="11" x2="26" y2="19"/>
      <line x1="133" y1="11" x2="133" y2="19"/>
      <line x1="240" y1="11" x2="240" y2="19"/>
    </g>
    <g stroke-width="1.6">
      <line x1="47.4" y1="14.5" x2="47.4" y2="19"/>
      <line x1="68.8" y1="14.5" x2="68.8" y2="19"/>
      <line x1="90.2" y1="14.5" x2="90.2" y2="19"/>
      <line x1="111.6" y1="14.5" x2="111.6" y2="19"/>
      <line x1="154.4" y1="14.5" x2="154.4" y2="19"/>
      <line x1="175.8" y1="14.5" x2="175.8" y2="19"/>
      <line x1="197.2" y1="14.5" x2="197.2" y2="19"/>
      <line x1="218.6" y1="14.5" x2="218.6" y2="19"/>
    </g>
  </g>

  <!-- the slot the cap rides in -->
  <rect x="13" y="47.2" width="240" height="1.6" rx="0.8" fill="#ffffff" opacity="0.7"/>
  <rect x="13" y="35.5" width="240" height="11" rx="5.5" fill="url(#slot)"/>
  <rect x="13" y="35.5" width="240" height="11" rx="5.5" fill="none" stroke="#050607" stroke-width="1.2"/>
  <rect x="19" y="40.3" width="228" height="1.6" rx="0.8" fill="#4a5055"/>

  <!-- the cap -->
  <g transform="translate({26 + 214 * t} 41)">
    <rect x="-9" y="-15" width="24" height="38" rx="4" fill="#000000" opacity="0.32"/>
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="url(#chrome)"/>
    <rect x="-14" y="-8" width="28" height="16" rx="3" fill="none" stroke="#5f5b50" stroke-width="0.8"/>
    <rect x="-11" y="-18" width="22" height="36" rx="3.5" fill="url(#cap)"/>
    <rect x="-11" y="-18" width="22" height="36" rx="3.5" fill="none" stroke="#08090a" stroke-width="1"/>
    <rect x="-8.5" y="-16.6" width="17" height="1.5" rx="0.75" fill="#ffffff" opacity="0.38"/>
    <g stroke="#060708" stroke-width="1.4" stroke-linecap="round">
      <line x1="-7.4" y1="-12" x2="-7.4" y2="12"/>
      <line x1="-4.4" y1="-12" x2="-4.4" y2="12"/>
      <line x1="4.4" y1="-12" x2="4.4" y2="12"/>
      <line x1="7.4" y1="-12" x2="7.4" y2="12"/>
    </g>
    <g stroke="#74767c" stroke-width="0.7" stroke-linecap="round" opacity="0.75">
      <line x1="-6.3" y1="-12" x2="-6.3" y2="12"/>
      <line x1="-3.3" y1="-12" x2="-3.3" y2="12"/>
      <line x1="5.5" y1="-12" x2="5.5" y2="12"/>
      <line x1="8.5" y1="-12" x2="8.5" y2="12"/>
    </g>
    <rect x="-1.5" y="-15" width="3" height="30" rx="1.5" fill="#f6f3ea"/>
  </g>
</svg>
